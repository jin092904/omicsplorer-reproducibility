name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reproducibility-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Type check
        run: uv run mypy src
      - name: Unit and artifact-contract tests
        run: uv run pytest
      - name: Verify public artifact checksums
        run: uv run python scripts/update_artifact_checksums.py --check
